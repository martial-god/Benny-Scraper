name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore Benny-Scraper.sln

      - name: Build
        run: dotnet build Benny-Scraper.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Benny-Scraper.Tests/Benny-Scraper.Tests.csproj --configuration Release --no-build --no-restore
